<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Pricing System - Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Global Pricing Management System</h2>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white">1. Upload CSV Feed</div>
        <div class="card-body">
            <div class="input-group mb-3">
                <input type="file" class="form-control" id="csvFileInput" accept=".csv">
                <button class="btn btn-success" onclick="uploadFeed()">Upload Feed</button>
            </div>
            <div id="uploadStatus" class="alert d-none"></div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-secondary text-white">2. Search Pricing Records</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-5">
                    <input type="text" class="form-control" id="storeIdInput" placeholder="Store ID (e.g., STORE-101)">
                </div>
                <div class="col-md-5">
                    <input type="text" class="form-control" id="skuInput" placeholder="SKU (e.g., SKU-999)">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="searchPrices()">Search</button>
                </div>
            </div>
        </div>
    </div>

    <table class="table table-striped table-hover bg-white border">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Store ID</th>
            <th>SKU</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="resultsBody">
        <tr><td colspan="7" class="text-center">No data loaded. Try searching or uploading first.</td></tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Price</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editRecordId">
                <input type="hidden" id="editRecordVersion">
                <div class="mb-3">
                    <label>Product:</label>
                    <input type="text" class="form-control" id="editProductName" readonly>
                </div>
                <div class="mb-3">
                    <label>New Price:</label>
                    <input type="number" step="0.01" class="form-control" id="editPrice">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="savePrice()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = 'http://localhost:8080/api/v1';
    let editModal = new bootstrap.Modal(document.getElementById('editModal'));

    // --- UPLOAD FEED ---
    async function uploadFeed() {
        const fileInput = document.getElementById('csvFileInput');
        const statusDiv = document.getElementById('uploadStatus');

        if (fileInput.files.length === 0) {
            showAlert(statusDiv, 'Please select a CSV file first.', 'danger');
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            statusDiv.className = 'alert alert-info mt-3';
            statusDiv.innerText = 'Uploading...';

            const response = await fetch(`${API_BASE}/feeds/upload`, {
                method: 'POST',
                body: formData
            });

            if (response.status === 202) {
                showAlert(statusDiv, 'Upload successful! Background processing has started.', 'success');
            } else {
                showAlert(statusDiv, 'Upload failed.', 'danger');
            }
        } catch (error) {
            showAlert(statusDiv, 'Server error. Is Kafka running?', 'danger');
        }
    }

    // --- SEARCH PRICES ---
    async function searchPrices() {
        const storeId = document.getElementById('storeIdInput').value;
        const sku = document.getElementById('skuInput').value;
        const tbody = document.getElementById('resultsBody');

        if (!storeId && !sku) {
            alert('Please enter at least a Store ID or SKU.');
            return;
        }

        try {
            const url = `${API_BASE}/pricing/search?storeId=${storeId}&sku=${sku}`;
            const response = await fetch(url);
            const data = await response.json();

            tbody.innerHTML = '';
            if (data.content && data.content.length > 0) {
                data.content.forEach(record => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${record.id}</td>
                            <td>${record.storeId}</td>
                            <td>${record.sku}</td>
                            <td>${record.productName}</td>
                            <td><b>${record.price} ${record.currency}</b></td>
                            <td>${record.effectiveDate}</td>
                            <td>
                                <button class="btn btn-sm btn-warning"
                                    onclick="openEditModal(${record.id}, '${record.productName}', ${record.price}, ${record.version})">
                                    Edit
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">No records found.</td></tr>';
            }
        } catch (error) {
            alert('Error fetching data.');
        }
    }

    // --- EDIT PRICE ---
    function openEditModal(id, productName, price, version) {
        document.getElementById('editRecordId').value = id;
        document.getElementById('editRecordVersion').value = version;
        document.getElementById('editProductName').value = productName;
        document.getElementById('editPrice').value = price;
        editModal.show();
    }

    async function savePrice() {
        const id = document.getElementById('editRecordId').value;
        const newPrice = document.getElementById('editPrice').value;
        const version = document.getElementById('editRecordVersion').value;

        const payload = {
            price: parseFloat(newPrice),
            version: parseInt(version)
        };

        try {
            const response = await fetch(`${API_BASE}/pricing/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                editModal.hide();
                alert('Price updated successfully!');
                searchPrices(); // Refresh table
            } else if (response.status === 409) {
                alert('CONFLICT: This record was just updated by an automated feed! Please refresh and try again.');
            } else {
                alert('Error updating price.');
            }
        } catch (error) {
            alert('Server error.');
        }
    }

    function showAlert(element, message, type) {
        element.className = `alert alert-${type} mt-3`;
        element.innerText = message;
        element.classList.remove('d-none');
    }
</script>
</body>
</html>
